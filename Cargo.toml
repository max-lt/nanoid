[package]
name = "nanoid"
version = "0.1.3"
edition = "2021"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[features]
# Adds --infnoise: draw randomness from an Infinite Noise TRNG.
infnoise = ["dep:infnoise-rs"]

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
infnoise-rs = { git = "https://github.com/max-lt/infnoise-rs.git", rev = "0e52ee9e2cdb02fc42a7bc38e4436b84e170358b", features = ["rand"], optional = true }
rand = "0.10.2"

name: Rust

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Test
      run: cargo test --release

    - name: Build
      run: cargo build --release

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        gh release create "$GITHUB_REF_NAME" target/release/nanoid
        --title "Release $GITHUB_REF_NAME" --verify-tag
